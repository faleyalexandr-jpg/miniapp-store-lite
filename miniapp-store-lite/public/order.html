<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuddaPlay — Заказ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f8f9fb;margin:0;padding:20px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  max-width:420px;
  margin:20px auto;
  box-shadow:0 2px 5px rgba(0,0,0,.05);
}
h2{text-align:center;}
.status{
  text-align:center;
  padding:8px 12px;
  border-radius:999px;
  font-weight:600;
  width:fit-content;
  margin:0 auto 10px;
}
.status.pending{background:#fff3cd;color:#856404;}
.status.paid{background:#d4edda;color:#155724;}
img{width:100%;border-radius:10px;margin-bottom:10px;}
.details{font-size:15px;line-height:1.5;}
.keybox{margin-top:10px;padding:10px;border:1px dashed #999;border-radius:10px;text-align:center;}
button{
  display:block;
  width:100%;
  padding:12px;
  background:#0088cc;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="card" id="card">
  <h2>Статус заказа</h2>
  <div id="status" class="status">Загрузка...</div>
  <div id="content"></div>
</div>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();

const params=new URLSearchParams(location.search);
const id=params.get('id');
if(!id){document.getElementById('content').innerHTML='<p>Не указан ID заказа.</p>';throw new Error();}

async function loadOrder(){
  try{
    const r=await fetch('/api/orders/'+id,{headers:{'x-telegram-init-data':tg?.initData||''}});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||r.statusText);
    render(j);
  }catch(e){
    document.getElementById('content').innerHTML='<p style="color:red">'+e.message+'</p>';
  }
}
function render(o){
  const s=document.getElementById('status');
  s.textContent=o.status==='paid'?'Оплачено':'Ожидает оплату';
  s.className='status '+o.status;
  document.getElementById('content').innerHTML=`
    <img src="${o.product.image_url||'https://placehold.co/300x200'}" alt="">
    <div class="details">
      <b>${o.product.title}</b><br>
      Сумма: ${(o.amount/100).toFixed(2)} ${o.currency}<br>
      Создан: ${o.created_at}<br>
      ${o.paid_at ? 'Оплачен: '+o.paid_at+'<br>':''}
    </div>
    ${o.delivered_key_mask ? '<div class="keybox">Ваш ключ: <b>'+o.delivered_key_mask+'</b></div>' : ''}
    <button onclick="tg.close()">Закрыть</button>
  `;
}

loadOrder();
</script>
</body>
</html>

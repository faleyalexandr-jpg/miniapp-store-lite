<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuddaPlay Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{
  font-family: system-ui,sans-serif;
  background: #f7f8fa;
  margin: 0;
  padding: 0;
}
header{
  padding: 16px;
  text-align: center;
  font-weight: 700;
  font-size: 20px;
  background: #fff;
  box-shadow: 0 2px 4px rgba(0,0,0,.05);
  position: sticky; top: 0; z-index: 10;
}
main{padding: 16px;}
input{
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 16px;
}
.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(160px,1fr));
  gap: 16px;
}
.card{
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 5px rgba(0,0,0,.05);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all .2s ease;
}
.card:hover{transform: translateY(-2px);}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;}
.card-content{padding:10px;flex-grow:1;}
.card h3{margin:0;font-size:16px;line-height:1.3;}
.card p{font-size:13px;color:#666;margin:6px 0;}
.price{font-weight:700;margin-top:auto;}
button.buy{
  background:#0088cc;
  color:#fff;
  border:none;
  padding:10px 14px;
  width:100%;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
  transition:background .2s ease;
}
button.buy:hover{background:#0078b5;}
.loading{text-align:center;padding:40px;font-size:16px;color:#888;}
.empty{text-align:center;color:#999;padding:40px;}
</style>
</head>
<body>
<header>🎮 BuddaPlay</header>
<main>
  <input id="search" placeholder="Поиск по названию..." />
  <div id="grid" class="grid"></div>
  <div id="status" class="loading">Загрузка товаров...</div>
</main>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();

async function loadProducts(q=''){
  document.getElementById('status').textContent='Загрузка...';
  const res = await fetch('/api/products?search='+encodeURIComponent(q));
  const data = await res.json();
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  if(!data.items?.length){
    document.getElementById('status').innerHTML='<div class="empty">Нет товаров</div>';
    return;
  }
  document.getElementById('status').textContent='';
  data.items.forEach(p=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <img src="${p.image_url||'https://placehold.co/300x200'}" alt="">
      <div class="card-content">
        <h3>${p.title}</h3>
        <p>${p.description||''}</p>
        <div class="price">${(p.price/100).toFixed(2)} ${p.currency}</div>
      </div>
      <button class="buy">Купить</button>
    `;
    card.querySelector('button').onclick=()=>buyProduct(p.id);
    grid.appendChild(card);
  });
}

async function buyProduct(productId){
  try{
    const r=await fetch('/api/checkout',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-telegram-init-data':tg?.initData||''
      },
      body:JSON.stringify({productId,provider:'test'})
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||r.statusText);
    tg?.openLink(j.redirectUrl);
  }catch(e){
    alert('Ошибка: '+e.message);
  }
}

document.getElementById('search').oninput=(e)=>{
  const q=e.target.value.trim();
  loadProducts(q);
};

loadProducts();
</script>
</body>
</html>

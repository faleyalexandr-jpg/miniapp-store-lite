<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Магазин XBOX ключей — LITE</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{border:1px solid #eee;border-radius:12px;padding:12px}.img{width:100%;border-radius:8px;background:#f6f6f6;aspect-ratio:4/3;object-fit:cover}.row{display:flex;justify-content:space-between;align-items:center}input,button,select{padding:8px}</style><script src='https://telegram.org/js/telegram-web-app.js'></script></head><body><h2>Магазин XBOX ключей — LITE</h2><div class='row' style='gap:12px;flex-wrap:wrap'><input id='q' placeholder='Поиск...' style='flex:1;min-width:220px'><select id='provider'><option value='test'>Тест (dev)</option><option value='yookassa'>YooKassa</option><option value='nowpayments'>NOWPayments</option></select></div><div id='list' class='grid' style='margin-top:12px'></div><h3 style='margin-top:24px'>Мои заказы</h3><ul id='orders'></ul><script>const API='';function initData(){try{return window.Telegram?.WebApp?.initData||''}catch{return ''}}function fmt(a,c){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(a/100)}catch{return (a/100)+' '+c}}async function loadProducts(q=''){const u=new URL('/api/products', location.origin); if(q)u.searchParams.set('search', q); const r=await fetch(u,{headers:{'x-telegram-init-data':initData()}}); return r.json()}async function loadOrders(){const r=await fetch('/api/my/orders',{headers:{'x-telegram-init-data':initData()}}); return r.json()}async function buy(id){const provider=document.getElementById('provider').value; const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json','x-telegram-init-data':initData()},body:JSON.stringify({productId:id,provider})}); const j=await r.json(); if(j.redirectUrl) location.href=j.redirectUrl;}async function render(){const q=document.getElementById('q').value.trim(); const data=await loadProducts(q); const list=document.getElementById('list'); list.innerHTML=''; data.items.forEach(p=>{const d=document.createElement('div'); d.className='card'; d.innerHTML=`<img class='img' src='${p.image_url||'https://placehold.co/400x300'}'><div style='font-weight:600;margin-top:8px'>${p.title}</div><div style='font-size:12;opacity:.8;min-height:32px'>${p.description||''}</div><div class='row' style='margin-top:8px'><div>${fmt(p.price,p.currency)}</div><button data-id='${p.id}'>Купить</button></div>`; d.querySelector('button').onclick=()=>buy(p.id); list.appendChild(d);}); try{const ord=await loadOrders(); const ul=document.getElementById('orders'); ul.innerHTML=''; (ord.items||[]).forEach(o=>{const li=document.createElement('li'); li.textContent=`#${o.id} — ${o.status}`+(o.delivered_key?` — ключ: ${o.delivered_key}`:''); ul.appendChild(li);});}catch{}}document.getElementById('q').addEventListener('input', ()=>render()); render();</script></body></html>
